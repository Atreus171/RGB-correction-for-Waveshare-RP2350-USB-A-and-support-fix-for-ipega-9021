name: CI Build All

on:
  push:
    branches: [main, gamesir-g7-support]
  pull_request:
    branches: [main]

jobs:
  # ------------------------------------------------------------------
  # RP2040 / RP2350 (Docker + pico-sdk)
  # ------------------------------------------------------------------
  build-rpi:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - bt2gc_pico_w
          - bt2gc_pico2_w
          - bt2n64_pico_w
          - bt2n64_pico2_w
          - bt2nuon_pico_w
          - bt2nuon_pico2_w
          - bt2usb_pico_w
          - bt2usb_pico2_w
          - bt2usb_waveshare_rp2350b_plus_w
          - bt2wiiext_pico_w
          - btusb2usb_pico_w
          - btusb2usb_pico2_w
          - controller_alpakka_pico
          - controller_btusb_pico_w
          - controller_btusb_pico2_w
          - controller_btusb_rp2040_abb
          - controller_fisherprice_v1_kb2040
          - controller_fisherprice_v2_kb2040
          - gc2eth_feather_usbhost
          - gc2eth_rp2040_eth
          - gc2usb_feather_usbhost
          - gc2usb_kb2040
          - gc2usb_rp2040zero
          - jvs2usb_rp2040zero
          - lodgenet2gc_pico
          - lodgenet2n64_pico
          - lodgenet2usb_pico
          - lodgenet2usb_pico2
          - n642dc_kb2040
          - n642dc_pico2_w
          - n642nuon_pico
          - n642usb_kb2040
          - neogeo2usb_kb2040
          - neogeo2usb_rp2040zero
          - nes2usb_kb2040
          - nes2usb_pico_w
          - pce2usb_kb2040
          - pce2usb_pico
          - pce2usb_pico_w
          - snes2usb_kb2040
          - usb23do_rp2040zero
          - usb2ami_rp2040zero
          - usb2ami_xiao
          - usb2ble_pico_w
          - usb2ble_pico2_w
          - usb2dc_kb2040
          - usb2dc_rp2040zero
          - usb2gc_kb2040
          - usb2gc_rp2040zero
          - usb2n64_kb2040
          - usb2neogeo_kb2040
          - usb2neogeo_pico
          - usb2neogeo_retrofrog
          - usb2neogeo_rp2040zero
          - usb2nuon_kb2040
          - usb2pce_kb2040
          - usb2uart_kb2040
          - usb2usb_feather_rp2040
          - usb2usb_feather_rp2040_max3421
          - usb2usb_feather_rp2040_usb_host
          - usb2usb_feather_rp2040_usb_host_max3421
          - usb2usb_pico
          - usb2usb_pico_w
          - usb2usb_pico2_w
          - usb2usb_rp2040zero
          - usb2usb_rp2350usba
          - wii2gc_kb2040
          - wii2usb_kb2040

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: joypad:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ${{ matrix.app }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            joypad:latest /bin/bash -c "make ${{ matrix.app }}"

          sudo chown -R $(id -u):$(id -g) releases/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.app }}
          path: releases/*.uf2
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------------
  # ESP32-S3 (ESP-IDF)
  # ------------------------------------------------------------------
  build-esp:
    name: build-esp (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: bt2usb_esp32s3
            idf_target: esp32s3
            board: xiao_esp32s3
            config_app: bt2usb
            bin_name: bt2usb
            uf2_family: "0xc47e5767"
          - app: controller_btusb_feather_esp32s3
            idf_target: esp32s3
            board: feather_esp32s3
            config_app: controller_btusb
            bin_name: controller_btusb
            uf2_family: "0xc47e5767"

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build ${{ matrix.app }}
        run: |
          SDKCFG="sdkconfig.defaults"
          if [ -f "esp/sdkconfig.board.${{ matrix.board }}" ]; then
            SDKCFG="$SDKCFG;sdkconfig.board.${{ matrix.board }}"
          fi
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/esp \
            espressif/idf:v6.0-beta2 \
            bash -c "SDKCONFIG_DEFAULTS='$SDKCFG' idf.py -DCONFIG_APP=${{ matrix.config_app }} -DCONFIG_BOARD=${{ matrix.board }} build"

          sudo chown -R $(id -u):$(id -g) esp/build/

      - name: Generate UF2
        run: |
          mkdir -p releases
          python3 esp/tools/uf2conv.py esp/build/joypad_${{ matrix.bin_name }}.bin \
            --base 0 --family ${{ matrix.uf2_family }} \
            --output releases/joypad_${{ matrix.app }}.uf2 \
            --convert

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.app }}
          path: releases/*.uf2
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------------
  # nRF52840 (nRF Connect SDK / Zephyr)
  # ------------------------------------------------------------------
  build-nrf:
    name: build-nrf (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: bt2usb_seeed_xiao_nrf52840
            board: xiao_ble
            app_type: bt2usb
          - app: bt2usb_feather_nrf52840
            board: adafruit_feather_nrf52840
            app_type: bt2usb
          - app: usb2usb_feather_nrf52840_max3421
            board: adafruit_feather_nrf52840
            app_type: usb2usb
          - app: btusb2usb_feather_nrf52840
            board: adafruit_feather_nrf52840
            app_type: btusb2usb
          - app: controller_btusb_feather_nrf52840
            board: adafruit_feather_nrf52840
            app_type: controller_btusb

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install west
        run: pip3 install west

      - name: Cache nRF Connect SDK
        uses: actions/cache@v4
        id: ncs-cache
        with:
          path: |
            nrf/.west
            nrf/nrf
            nrf/zephyr
            nrf/modules
            nrf/bootloader
            nrf/tools
            nrf/nrfxlib
            nrf/test
          key: ncs-v3.1.0-${{ runner.os }}

      - name: Initialize nRF Connect SDK
        if: steps.ncs-cache.outputs.cache-hit != 'true'
        working-directory: nrf
        run: |
          west init -m https://github.com/nrfconnect/sdk-nrf.git --mr v3.1.0
          west update --narrow -o=--depth=1

      - name: Install Python dependencies
        working-directory: nrf
        run: pip3 install -r zephyr/scripts/requirements.txt

      - name: Install Zephyr SDK
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.0/zephyr-sdk-0.17.0_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-0.17.0_linux-x86_64_minimal.tar.xz -C /opt/
          /opt/zephyr-sdk-0.17.0/setup.sh -t arm-zephyr-eabi -c
          echo "ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk-0.17.0" >> $GITHUB_ENV

      - name: Build ${{ matrix.app }}
        working-directory: nrf
        run: |
          west build -b ${{ matrix.board }} . --pristine=always -- \
            -DAPP_TYPE=${{ matrix.app_type }} \
            $([ -f boards/${{ matrix.board }}.overlay ] && echo "-DDTC_OVERLAY_FILE=$(pwd)/boards/${{ matrix.board }}.overlay") \
            $(EXTRA=""; \
              [ -f boards/${{ matrix.board }}.conf ] && EXTRA="$(pwd)/boards/${{ matrix.board }}.conf"; \
              [ -f prj_${{ matrix.app_type }}.conf ] && { [ -n "$EXTRA" ] && EXTRA="$EXTRA;$(pwd)/prj_${{ matrix.app_type }}.conf" || EXTRA="$(pwd)/prj_${{ matrix.app_type }}.conf"; }; \
              [ -n "$EXTRA" ] && echo "-DEXTRA_CONF_FILE=$EXTRA")

      - name: Copy firmware
        run: |
          mkdir -p releases
          cp nrf/build/nrf/zephyr/zephyr.uf2 releases/joypad_${{ matrix.app }}.uf2

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.app }}
          path: releases/*.uf2
          if-no-files-found: error
          retention-days: 1